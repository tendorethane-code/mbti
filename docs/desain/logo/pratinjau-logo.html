<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draf Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121019;--ink:#ecebf3;--mute:#a9a6ba;--pan:#1c1928;--line:#2e2a3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;padding:22px 16px 40px}
h1{margin:0 0 4px;font-size:22px}p.lead{margin:0 0 16px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:20px;padding:14px}
.card h2{margin:0 0 2px;font-size:17px}.card small{display:block;color:var(--mute);margin-bottom:10px;line-height:1.4}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big{width:120px;height:120px}.bgL{background:#fff;padding:10px;border-radius:16px}.bgD{background:#0b0a12;padding:10px;border-radius:16px}
.sizes{display:flex;align-items:flex-end;gap:10px;margin-top:10px}.sizes span{display:block;font-size:10px;color:var(--mute);text-align:center}
.tab{margin-top:12px;display:flex;align-items:center;gap:8px;background:#2b2935;border-radius:10px 10px 0 0;padding:7px 12px;width:210px;font-size:12px;color:#ddd}
.tab img{width:16px;height:16px}
.ctx{display:flex;gap:12px;margin-top:12px;align-items:center}
.phone{width:88px;text-align:center;font-size:10px;color:#ddd;background:linear-gradient(160deg,#3a2f7a,#7a3a5a);padding:12px 6px;border-radius:14px}.phone img{width:56px;height:56px;border-radius:13px;display:block;margin:0 auto 4px;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;background:#fff;color:#15151a;padding:8px 12px;border-radius:12px}.bar img{width:24px;height:24px;border-radius:6px}
</style></head><body>
<h1>Draf logo Peta Kepribadian</h1><p class="lead">Semua orisinal, dibuat kode (SVG). Diuji di ukuran besar, 64, 32, 16 px (ikon tab browser), latar terang dan gelap, dan contoh pemakaian.</p>
<div class="grid" id="g"></div>
<script src="logo-draf.js"></script>
<script>
const url=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
document.getElementById('g').innerHTML=Object.values(LOGO_DRAF).map(L=>{const u=url(L.svg());return `<div class="card"><h2>${L.nama}</h2><small>${L.ket}</small>
<div class="row"><div class="bgL"><img class="big" src="${u}" alt=""></div><div class="bgD"><img class="big" src="${u}" alt=""></div></div>
<div class="sizes">${[64,32,16].map(z=>`<div><img src="${u}" width="${z}" height="${z}" alt=""><span>${z} px</span></div>`).join('')}</div>
<div class="tab"><img src="${u}" alt="">Peta Kepribadian</div>
<div class="ctx"><div class="phone"><img src="${u}" alt="">Peta Kepribadian</div><div class="bar"><img src="${u}" alt="">Peta Kepribadian</div></div></div>`}).join('');
</script></body></html>
